<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>IQ Store</title>
    <script type="text/javascript">
        // Этот скрипт берет текущий путь (например, /catalog) и превращает его в query-параметр
        // Затем делает редирект на главную страницу, сохраняя историю переходов.
        var pathSegmentsToKeep = 1; // 1 segment для репозитория проекта (iq-store-mvp-preview)

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
